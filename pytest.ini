[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
markers =
    smoke: быстрые smoke-тесты
    regression: регрессионные тесты
    negative: негативные сценарии